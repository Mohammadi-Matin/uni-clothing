<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uni Clothing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>

  :root{
    --bg: #F6F4EF;
    --ink: #1C1B19;
    --stone: #B7AFA0;
    --stone-light: #E4DFD3;
    --camel: #8C6B41;
    --line: #DAD4C8;
    --hero-bg: #15130F;
    --cream: #F1ECE1;
    --hero-copy: #B9AF9C;
    --max: 1120px;
  }

  *{ box-sizing: border-box; }

  body::after{
    content: "";
    position: fixed;
    inset: 0;
    z-index: 999;
    pointer-events: none;
    opacity: 0.025;
    mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  ::selection{ background: var(--ink); color: var(--bg); }

  html{ scroll-behavior: smooth; }

  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  a{ color: inherit; text-decoration: none; }

  h1,h2,h3{
    font-family: 'Fraunces', serif;
    font-weight: 400;
    margin: 0;
    line-height: 1.05;
  }

  p{ margin: 0; }

  button{
    font-family: 'IBM Plex Sans', sans-serif;
    cursor: pointer;
    background: none;
    border: none;
    color: inherit;
    font-size: 1em;
  }

  :focus-visible{
    outline: 2px solid var(--camel);
    outline-offset: 3px;
  }

  .frame{
    max-width: var(--max);
    margin: 0 auto;
    padding: 0 32px;
  }

  /* ---------- top rule ---------- */

  .top-rule{
    height: 3px;
    background: var(--camel);
    width: 100%;
  }

  /* ---------- header ---------- */

  .site-header{
    display:flex;
    align-items: center;
    justify-content: space-between;
    padding: 30px 0 22px;
    border-bottom: 1px solid var(--line);
  }

  .wordmark{
    font-family: 'Fraunces', serif;
    font-size: 1.5rem;
    font-weight: 500;
    letter-spacing: 0.01em;
  }

  .site-nav{
    display: flex;
    gap: 36px;
  }

  .site-nav a{
    font-size: 0.92rem;
    color: var(--ink);
    padding-bottom: 2px;
    border-bottom: 1px solid transparent;
  }

  .site-nav a:hover, .site-nav a.active{
    border-bottom-color: var(--ink);
  }

  .nav-toggle{
    display: none;
    flex-direction: column;
    justify-content: center;
    gap: 5px;
    width: 32px;
    height: 32px;
    border: none;
    background: none;
    padding: 0;
  }

  .nav-toggle span{
    display: block;
    height: 1px;
    background: var(--ink);
    width: 100%;
  }

  /* ---------- footer ---------- */

  .site-footer{
    display:flex;
    align-items: center;
    justify-content: space-between;
    padding: 26px 0 60px;
    margin-top: 100px;
    border-top: 1px solid var(--line);
    font-size: 0.82rem;
    color: var(--stone);
  }

  /* ---------- hero ---------- */

  .hero-band{
    position: relative;
    left: 50%;
    right: 50%;
    width: 100vw;
    margin-left: -50vw;
    margin-right: -50vw;
    background: var(--hero-bg);
    color: var(--cream);
    overflow: hidden;
  }

  .hero-band::before{
    content: "";
    position: absolute;
    inset: 0;
    opacity: 0.05;
    mix-blend-mode: overlay;
    pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  .hero-inner{
    position: relative;
    max-width: var(--max);
    margin: 0 auto;
    padding: 128px 32px 108px;
  }

  .hero-inner h1{
    font-size: clamp(4.2rem, 11vw, 8.4rem);
    font-weight: 300;
    letter-spacing: -0.01em;
    overflow: hidden;
  }

  .hero-inner h1 span{
    display: inline-block;
  }

  @media (prefers-reduced-motion: no-preference){
    .hero-inner h1 span{
      transform: translateY(112%);
      animation: revealUp 900ms cubic-bezier(.16,1,.3,1) forwards;
      animation-delay: 0.15s;
    }
  }

  @keyframes revealUp{
    to{ transform: translateY(0); }
  }

  .hero-tagline{
    font-family: 'Fraunces', serif;
    font-size: clamp(1.3rem, 2.6vw, 1.7rem);
    font-weight: 300;
    max-width: 30ch;
    margin-top: 28px;
    color: var(--cream);
  }

  .hero-sub{
    font-size: 0.98rem;
    max-width: 40ch;
    margin-top: 16px;
    color: var(--hero-copy);
  }

  .btn{
    display: inline-block;
    margin-top: 34px;
    padding: 13px 26px;
    border: 1px solid var(--ink);
    font-size: 0.92rem;
  }

  .btn:hover{
    background: var(--ink);
    color: var(--bg);
  }

  .btn-invert{
    display: inline-block;
    margin-top: 34px;
    padding: 13px 26px;
    border: 1px solid var(--cream);
    color: var(--cream);
    font-size: 0.92rem;
  }

  .btn-invert:hover{
    background: var(--cream);
    color: var(--hero-bg);
  }

  @media (prefers-reduced-motion: no-preference){
    .btn, .btn-invert{ transition: background 0.18s ease, color 0.18s ease; }
  }

  /* ---------- index / catalogue list ---------- */

  .index-list{
    margin-top: 56px;
  }

  .index-row{
    display: grid;
    grid-template-columns: 90px 1fr auto;
    gap: 24px;
    align-items: baseline;
    padding: 22px 16px;
    margin: 0 -16px;
    border-bottom: 1px solid var(--line);
  }

  .index-row:first-child{
    border-top: 1px solid var(--line);
  }

  @media (prefers-reduced-motion: no-preference){
    .index-row{ transition: background-color 0.18s ease; }
    .index-row *{ transition: color 0.18s ease; }
  }

  .index-row:hover{
    background-color: var(--ink);
  }

  .index-row:hover .index-code,
  .index-row:hover .index-name,
  .index-row:hover .index-price{
    color: var(--cream);
  }

  .index-code{
    font-size: 0.85rem;
    color: var(--camel);
    letter-spacing: 0.02em;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  .swatch-dot{
    width: 7px;
    height: 7px;
    border-radius: 50%;
    display: inline-block;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.15);
  }

  .index-row:hover .swatch-dot{
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.3);
  }

  .index-name{
    font-family: 'Fraunces', serif;
    font-size: 1.5rem;
    font-weight: 400;
  }

  .index-price{
    font-size: 0.9rem;
    color: var(--stone);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .index-row a.index-name-link{
    display:inline-block;
  }

  .index-row a.index-name-link:hover .index-name{
    color: var(--camel);
  }

  /* ---------- manifesto ---------- */

  .manifesto{
    padding: 90px 0;
    border-bottom: 1px solid var(--line);
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 48px;
  }

  .manifesto-label{
    font-size: 0.85rem;
    color: var(--stone);
  }

  .manifesto p{
    font-family: 'Fraunces', serif;
    font-size: clamp(1.4rem, 2.4vw, 1.9rem);
    font-weight: 300;
    max-width: 26ch;
    color: #302e29;
  }

  /* ---------- shop grid ---------- */

  .page-heading{
    padding: 64px 0 8px;
  }

  .page-heading h2{
    font-size: clamp(2.4rem, 5vw, 3.4rem);
    font-weight: 300;
  }

  .page-heading .index-code{
    display:block;
    margin-bottom: 10px;
  }

  .shop-grid{
    margin-top: 48px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--line);
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }

  .shop-card{
    background: var(--bg);
    padding: 40px 28px 32px;
    display: flex;
    flex-direction: column;
  }

  @media (prefers-reduced-motion: no-preference){
    .shop-card{ transition: background-color 0.2s ease; }
  }

  .shop-card:hover{
    background: var(--stone-light);
  }

  .shop-card .garment-art{
    align-self: center;
    width: 130px;
    height: 168px;
    color: var(--ink);
    margin-bottom: 28px;
  }

  @media (prefers-reduced-motion: no-preference){
    .shop-card .garment-art svg{ transition: transform 0.25s ease; }
  }

  .shop-card:hover .garment-art svg{
    transform: scale(1.06);
  }

  .shop-card .index-code{
    margin-bottom: 8px;
  }

  .shop-card h3{
    font-size: 1.4rem;
    font-weight: 400;
    margin-bottom: 10px;
  }

  .shop-card .desc{
    font-size: 0.9rem;
    color: #4a473f;
    flex-grow: 1;
    margin-bottom: 22px;
  }

  .shop-card .card-footer{
    display:flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid var(--line);
    padding-top: 16px;
  }

  .shop-card .index-price{ color: var(--ink); }

  #app{
    opacity: 0;
  }

  @media (prefers-reduced-motion: no-preference){
    #app{
      animation: fadeIn 0.35s ease forwards;
    }
  }

  @media (prefers-reduced-motion: reduce){
    #app{ opacity: 1; }
  }

  @keyframes fadeIn{
    to{ opacity: 1; }
  }

  .view-link{
    font-size: 0.85rem;
    border-bottom: 1px solid var(--ink);
  }

  .view-link:hover{
    color: var(--camel);
    border-bottom-color: var(--camel);
  }

  .breadcrumb a:hover{ color: var(--ink); }

  /* ---------- product page ---------- */

  .breadcrumb{
    padding-top: 40px;
    font-size: 0.85rem;
    color: var(--stone);
  }

  .product-view{
    padding: 40px 0 100px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 72px;
  }

  .product-art{
    background: var(--stone-light);
    display: flex;
    align-items: center;
    justify-content: center;
    aspect-ratio: 4/5;
  }

  .product-art svg{
    width: 46%;
    color: var(--ink);
  }

  .product-info .index-code{
    display: block;
    margin-bottom: 14px;
  }

  .product-info h2{
    font-size: clamp(2rem, 3.6vw, 2.8rem);
    font-weight: 400;
    margin-bottom: 14px;
  }

  .product-info .price{
    font-size: 1.05rem;
    margin-bottom: 28px;
  }

  .product-info .desc{
    font-size: 0.98rem;
    color: #4a473f;
    max-width: 44ch;
    margin-bottom: 32px;
  }

  .detail-block{
    padding: 18px 0;
    border-top: 1px solid var(--line);
  }

  .detail-block:last-of-type{
    border-bottom: 1px solid var(--line);
  }

  .detail-block h4{
    font-size: 0.8rem;
    color: var(--stone);
    font-weight: 500;
    margin-bottom: 8px;
  }

  .detail-block p, .detail-block ul{
    font-size: 0.92rem;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .size-row{
    display: flex;
    gap: 10px;
    margin: 26px 0 30px;
  }

  .size-opt{
    border: 1px solid var(--line);
    padding: 9px 16px;
    font-size: 0.88rem;
  }

  .size-opt.selected{
    border-color: var(--ink);
    background: var(--ink);
    color: var(--bg);
  }

  .add-bag{
    width: 100%;
    padding: 16px;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: var(--bg);
    font-size: 0.95rem;
  }

  .add-bag:hover{ opacity: 0.85; }

  .toast{
    margin-top: 14px;
    font-size: 0.85rem;
    color: var(--camel);
    min-height: 1.2em;
  }

  /* ---------- about ---------- */

  .about-view{
    padding: 40px 0 100px;
  }

  .about-lede{
    max-width: 60ch;
    font-family: 'Fraunces', serif;
    font-size: clamp(1.4rem, 2.6vw, 1.9rem);
    font-weight: 300;
    margin: 24px 0 60px;
    color: #302e29;
  }

  .about-body{
    max-width: 62ch;
    font-size: 0.98rem;
    color: #4a473f;
  }

  .about-body p{ margin-bottom: 20px; }

  .principles{
    margin-top: 64px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 40px;
    padding-top: 40px;
    border-top: 1px solid var(--line);
  }

  .principles h4{
    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-size: 1.15rem;
    margin-bottom: 10px;
  }

  .principles p{
    font-size: 0.9rem;
    color: #4a473f;
  }

  /* ---------- contact ---------- */

  .contact-view{
    padding: 40px 0 120px;
  }

  .contact-view .about-lede{ margin-bottom: 30px; }

  .contact-view a.email{
    font-family: 'Fraunces', serif;
    font-size: 1.6rem;
    border-bottom: 1px solid var(--ink);
  }


  /* ---------- fabric swatch art ---------- */

  .art-coat, .art-trouser, .art-shirt{
    position: relative;
    background-size: cover;
    background-position: center;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
  }

    background-image: linear-gradient(180deg, rgba(0,0,0,0.12), rgba(0,0,0,0.4)), url(data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBgYIBwcICxILCwoKCxYPEA0SGhYbGhkWGRgcICgiHB4mHhgZIzAkJiorLS4tGyIyNTEsNSgsLSz/2wBDAQcICAsJCxULCxUsHRkdLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCz/wAARCAFKAQQDASIAAhEBAxEB/8QAFgABAQEAAAAAAAAAAAAAAAAAAAEH/8QAIBABAAMBAAIDAQEBAAAAAAAAAAERQTEhYVFxgbFCkf/EABYBAQEBAAAAAAAAAAAAAAAAAAABAv/EABQRAQAAAAAAAAAAAAAAAAAAAAD/2gAMAwEAAhEDEQA/AMhAYaAOAAAAlAoAAHigAAIMAAAAAADQPAAAABYAWAAcNAAAAAAAOgAB/AAAAAAACQACQA6aAAAAAAAAAGAAScAAK9AGAAAAAABoAAAAAAAAAAAHQAAAAAgAAAAAAAAAAAAPoAAAMAAsAAAAAAANAAAAAAAAAADAPZIAFBoAVYAJ+lgogC6IaIolrgoJc0ApSXJMgolyXIKIWCiALwSywUS5LBRPJcgokSApqFgoln6C4IAokzIIACgAAAHoNAAwACQAADoAAAAAAABgAAAFAAAAAAAAAAAAAAGGgAAAAAAaAAAAAAfQAAABoAUAAAAAHgAAAAAAAAAAAAACQw0DDQ8AAAAAaBIAAAAAAAAAAAdADgfYBAAAAWaGgAAAAcAAAAMJPwAAAwNAAADAAAAs0AOAAH6AAAB9AEgAGgAAAAAAAAAHQAAAMAAAAAJAAAgAMAAgAAENAAAAAAJAADgAHJAAAAoAAAIAAAABQAQIACgASYv4FABNBVEAUQBRAFEAUQBRDQUQBZEAUQBRAFEoBRAFoTAFEOgogC9EAAAAgAEUAAAMAAAAAAwAAAkAAwLAAAAADAAEBQAAAAAAAN4ABAABAAAAaAABoAAAAGAAGooFAAAABqAsAAAAikgAAAICgAAQAIoAAAAAejQAwwACQRQAAAAAAA/oE+eggoAGmgdAAAAD2mAoAAigAAAYABgAAIogKACKAAAAAAAH/AAAAAMAAAAANAEUACjylAugAYABXgAAAAEBQAAAOgAAABABoAgAAAAAB/QADwAAAAAAABgdAA0ADQAAAARQAAAC6wBF8ICqgUBaoAtloAp4QBbSwBTwgAaAKIAtoaQC6IAWvUAFQAVAFE0BRAFv2J4AAAIAAAAAAAAAANDoAQAAaAaAGAAAAAAAAAAAAAAYdXU0AJ4aAYafAAH+QAlfkECOgBoABpPJACQAMI4ABgAiz2QBJ6vwAB8ABHfwgAMQFEnoD//Z);

  </div>

<script>

  const PRODUCTS = [
    {
      id: "01",
      code: "UNI—01",
      name: "The Overcoat",
      price: "8,200,000",
      short: "A single-breasted overcoat cut from heavy virgin wool, built to outlast its first decade.",
      description: "Cut for either shoulder, The Overcoat is built from one continuous piece of heavy virgin wool and finished with a cupro lining sewn by hand at the seams. There is nothing on it that does not need to be there.",
      composition: "100% virgin wool shell, cupro lining, horn buttons",
      fit: "Unisex fit, sits at mid-thigh. Order your usual size.",
      care: "Dry clean only. Store on a wide hanger.",
      art: "coat"
    },
    {
      id: "02",
      code: "UNI—02",
      name: "The Column Trouser",
      price: "5,600,000",
      short: "A straight, floor-grazing trouser in wool-blend twill, cut without darts or decoration.",
      description: "A single straight line from waist to hem. The Column Trouser is cut without darts, pleats, or a break — a quiet trouser that holds its shape through a full day.",
      composition: "78% wool, 20% mohair, 2% elastane twill",
      fit: "Unisex fit, high rise, straight leg. True to size.",
      care: "Dry clean only. Steam to refresh.",
      art: "trouser"
    },
    {
      id: "03",
      code: "UNI—03",
      name: "The Structured Shirt",
      price: "5,900,000",
      short: "A heavyweight cotton poplin shirt with a built collar that holds its form unaided.",
      description: "Woven from a dense cotton poplin usually reserved for outerwear, The Structured Shirt keeps its shape through wear without any fusing at the collar. One shirt, worn on its own or under The Overcoat.",
      composition: "100% heavyweight cotton poplin, corozo buttons",
      fit: "Unisex fit, relaxed through the body. Order your usual size.",
      care: "Machine wash cold, hang dry.",
      art: "shirt"
    }
  ];

  const ART = {
    coat: `<svg viewBox="0 0 200 260" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round">
      <path d="M100 14 L78 34 L60 30 L18 58 L34 96 L54 82 L54 246 L146 246 L146 82 L166 96 L182 58 L140 30 L122 34 Z" />
      <path d="M78 34 L100 60 L122 34" />
      <path d="M100 60 L100 246" />

      <circle cx="94" cy="150" r="2" fill="currentColor" stroke="none"/>
      <circle cx="94" cy="180" r="2" fill="currentColor" stroke="none"/>
    </svg>`,
    trouser: `<svg viewBox="0 0 200 260" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round">
      <path d="M62 16 L138 16 L142 118 L166 246 L134 246 L104 128 L96 128 L82 246 L50 246 L58 118 Z" />
      <path d="M62 16 L58 40 L142 40 L138 16" />
    </svg>`,
    shirt: `<svg viewBox="0 0 200 260" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round">
      <path d="M100 20 L76 34 L64 26 L28 50 L44 84 L64 72 L64 244 L136 244 L136 72 L156 84 L172 50 L136 26 L124 34 Z" />
      <path d="M76 34 L100 56 L124 34" />
      <path d="M76 34 L88 46 L100 34" />
      <path d="M124 34 L112 46 L100 34" />
      <circle cx="100" cy="96" r="2" fill="currentColor" stroke="none"/>

      <circle cx="100" cy="156" r="2" fill="currentColor" stroke="none"/>
      <circle cx="100" cy="186" r="2" fill="currentColor" stroke="none"/>
    </svg>`
  };

  const SWATCH = {
    coat: "#2C2924",
    trouser: "#6E5436",
    shirt: "#E7E0CE"
  };

  function indexList(){
    return `
      <div class="index-list">
        ${PRODUCTS.map(p => `
          <div class="index-row">
            <span class="index-code"><span class="swatch-dot" style="background:${SWATCH[p.art]}"></span>${p.code}</span>
            <a class="index-name-link" href="#/product/${p.id}">
              <span class="index-name">${p.name}</span>
            </a>
            <span class="index-price">${p.price} تومان</span>
          </div>
        `).join("")}
      </div>
    `;
  }

  function homeView(){
    return `
      <div class="hero-band">
        <div class="hero-inner">
          <h1><span>Uni</span></h1>
          <p class="hero-tagline">Two garments. Considered without end.</p>
          <p class="hero-sub">Cut in Tehran to a discipline usually reserved for an entrance exam, not an overcoat. Est. 2026.</p>
          <a class="btn-invert" href="#/shop">View the Collection</a>
        </div>
      </div>

      ${indexList()}

      <section class="manifesto">
        <span class="manifesto-label">On restraint</span>
        <p>We make three pieces a year, not thirty. What we keep out of a garment matters as much as what stays in.</p>
      </section>
    `;
  }

  function shopView(){
    return `
      <section class="page-heading">
        <span class="index-code">Shop</span>
        <h2>The Collection</h2>
      </section>

      <div class="shop-grid">
        ${PRODUCTS.map(p => `
          <div class="shop-card">
            <div class="garment-art art-${p.art}">${ART[p.art]}</div>

            <p class="desc">${p.short}</p>
            <div class="card-footer">
              <span class="index-price">${p.price} تومان</span>
              <a class="view-link" href="#/product/${p.id}">View piece</a>
            </div>
          </div>
        `).join("")}
      </div>
    `;
  }

  function productView(id){
    const p = PRODUCTS.find(x => x.id === id) || PRODUCTS[0];
    return `
      <div class="breadcrumb">
        <a href="#/shop">Shop</a> / ${p.code}
      </div>
      <section class="product-view">
        <div class="product-art art-${p.art}">${ART[p.art]}</div>

          <span class="index-code">${p.code}</span>
          <h2>${p.name}</h2>
          <p class="price">${p.price} تومان</p>
          <p class="desc">${p.description}</p>

          <div class="size-row" id="size-row">
            ${["XS","S","M","L","XL"].map((s,i) => `<button class="size-opt${i===2 ? ' selected':''}" data-size="${s}">${s}</button>`).join("")}

          <button class="add-bag" id="add-bag">Add to Bag</button>
          <p class="toast" id="toast"></p>

          <div class="detail-block">
            <h4>Composition</h4>
            <p>${p.composition}</p>
          </div>
          <div class="detail-block">
            <h4>Fit</h4>
            <p>${p.fit}</p>
          </div>
          <div class="detail-block">
            <h4>Care</h4>
            <p>${p.care}</p>
          </div>
        </div>
      </section>
    `;
  }

  function aboutView(){
    return `
      <section class="about-view">
        <span class="index-code">About</span>
        <p class="about-lede">Uni was built on a simple bet: that a customer will always remember three pieces made without compromise longer than thirty made without intent.</p>
        <div class="about-body">
          <p>Every piece is cut and finished in ateliers in Tehran, by people who have spent decades doing exactly this and nothing else. We hold each garment to a standard closer to an examination than a production line — it either passes, or it does not leave the workshop.</p>
          <p>We do not chase seasons. A piece stays in the collection until we find a way to make it better, and it leaves only when it is retired, not discounted.</p>
        </div>

        <div class="principles">
          <div>
            <h4>Materials</h4>
            <p>Only natural, mill-sourced fabrics — wool, cotton, horn, corozo. Nothing synthetic touches skin.</p>
          </div>
          <div>
            <h4>Construction</h4>
            <p>Hand-finished seams and full canvassing where it matters, on every piece, without exception.</p>
          </div>
          <div>
            <h4>Discipline</h4>
            <p>Three pieces, reviewed and re-cut each year, rather than a calendar of new ones.</p>
          </div>
        </div>
      </section>
    `;
  }

  function contactView(){
    return `
      <section class="contact-view">
        <span class="index-code">Contact</span>
        <p class="about-lede">For fittings, made-to-order enquiries, or press.</p>
        <a class="email" href="mailto:hello@uniclothing.com">hello@uniclothing.com</a>
      </section>
    `;
  }

  function render(){
    const hash = location.hash || "#/home";
    const parts = hash.replace("#/", "").split("/");
    const route = parts[0] || "home";
    const app = document.getElementById("app");

    document.querySelectorAll(".site-nav a").forEach(a => {
      a.classList.toggle("active", a.dataset.route === route);
    });

    if (route === "shop") app.innerHTML = shopView();
    else if (route === "about") app.innerHTML = aboutView();
    else if (route === "contact") app.innerHTML = contactView();
    else if (route === "product") app.innerHTML = productView(parts[1]);
    else app.innerHTML = homeView();

    window.scrollTo(0, 0);
    bindInteractions();
  }

  function bindInteractions(){
    document.querySelectorAll(".size-opt").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".size-opt").forEach(b => b.classList.remove("selected"));
        btn.classList.add("selected");
      });
    });

    const addBtn = document.getElementById("add-bag");
    if (addBtn){
      addBtn.addEventListener("click", () => {
        document.getElementById("toast").textContent = "Added to bag — checkout is coming soon.";
      });
    }
  }

  window.addEventListener("hashchange", render);

  const navToggle = document.getElementById("nav-toggle");
  const siteNav = document.getElementById("site-nav");
  navToggle.addEventListener("click", () => {
    const isOpen = siteNav.classList.toggle("open");
    navToggle.setAttribute("aria-expanded", String(isOpen));
  });
  siteNav.addEventListener("click", (e) => {
    if (e.target.tagName === "A"){
      siteNav.classList.remove("open");
      navToggle.setAttribute("aria-expanded", "false");
    }
  });

  render();

</script>

</body>
</html>
